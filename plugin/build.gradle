plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

// 1. Project Metadata
group = 'com.github.malyshevhen'
// Dynamically set version from GitHub Tag (v1.2.3 -> 1.2.3) or fallback to SNAPSHOT
version = project.findProperty('projectVersion') ?: '0.0.1-SNAPSHOT'

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.gradle.avro

    // Testing dependencies
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        kaaAvro {
            id = 'kaa.rfcs-gradle-plugin'
            implementationClass = 'com.github.malyshevhen.gradle.avro.KaaRfcsPlugin'
        }
    }
}

// 2. Functional Testing Setup
sourceSets {
    functionalTest {}
}

configurations.functionalTestImplementation.extendsFrom(configurations.testImplementation)
configurations.functionalTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

tasks.register('functionalTest', Test) {
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    useJUnitPlatform()
}

gradlePlugin.testSourceSets.add(sourceSets.functionalTest)

tasks.named('check') {
    dependsOn(tasks.functionalTest)
}

tasks.named('test') {
    useJUnitPlatform()
}

base {
    archivesName = "kaa-rfcs-gradle-plugin"
}

// 3. Publishing Configuration
publishing {
    publications {
        // This is the default name the java-gradle-plugin gives to your main JAR
        pluginMaven(MavenPublication) {
            artifactId = "kaa-rfcs-gradle-plugin"
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/malyshevhen/kaa-rfcs-gradle-plugin"
            credentials {
                // In CI, these are provided by GitHub Actions
                // Locally, you can set them in your environment
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
