name: Daily Schema Watchdog

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update Submodule to Latest
        run: |
          git submodule update --remote --recursive

      - name: Check for Changes
        id: check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests Before Update
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          ./gradlew check || { echo "Tests failed, skipping release"; exit 1; }

      - name: Create Pull Request
        if: steps.check.outputs.CHANGED == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: auto-update schemas to latest"
          body: |
            Automated schema update from upstream repository.

            Changes detected in submodule. All tests passed before creating this PR.
          commit-message: "chore: auto-update schemas to latest"
          branch: auto-update-schemas
          base: main
          delete-branch: true
          labels: |
            automated
            schema-update
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show PR Details
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          echo "Pull Request created: ${{ steps.cpr.outputs.pull-request-url }}"
          echo "Pull Request Number: ${{ steps.cpr.outputs.pull-request-number }}"
