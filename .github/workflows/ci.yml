name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Phase 1: Verification ---
  test:
    name: Run All Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run All Tests
        run: ./gradlew check --info

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-java-${{ matrix.java }}
          path: plugin/build/test-results/test/

      - name: Upload Functional Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results-java-${{ matrix.java }}
          path: plugin/build/test-results/functionalTest/

      - name: Publish Unit Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests (Java ${{ matrix.java }})
          path: plugin/build/test-results/test/**/*.xml
          reporter: java-junit

      - name: Publish Functional Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Functional Tests (Java ${{ matrix.java }})
          path: plugin/build/test-results/functionalTest/**/*.xml
          reporter: java-junit

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java-${{ matrix.java }}
          path: plugin/build/reports/jacoco/test/

  # --- Phase 2: Release (Only on Tags) ---
  publish:
    name: Publish Plugin
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Packages
        run: ./gradlew publish -PprojectVersion=${{ steps.get_version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR for Release
        run: ./gradlew :plugin:jar -PprojectVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generateReleaseNotes: true
          artifacts: "plugin/build/libs/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}