name: Publish Plugin

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0, v1.2.3, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Packages
        run: ./gradlew publish -PprojectVersion=${{ steps.get_version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build the JAR specifically to ensure it's fresh for the release upload
      - name: Build JAR
        run: ./gradlew :plugin:jar -PprojectVersion=${{ steps.get_version.outputs.VERSION }}

      # 2. Create the GitHub Release and upload assets
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          # Automatically generates a list of commits since the last tag
          generateReleaseNotes: true
          artifacts: "plugin/build/libs/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}